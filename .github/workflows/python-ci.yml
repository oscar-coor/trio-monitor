name: Python CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  tests:
    name: Run backend tests (Pytest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest-cov mypy ruff

      - name: Run tests with pytest (coverage)
        env:
          DATABASE_URL: sqlite:///./test_db.sqlite
        working-directory: backend
        run: |
          pytest -q --cov=backend --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: backend/coverage.xml

      - name: Mypy type check (non-blocking for now)
        working-directory: backend
        continue-on-error: true
        run: |
          mypy .. --config-file ../mypy.ini || true

      - name: Ruff lint (non-blocking for now)
        working-directory: .
        continue-on-error: true
        run: |
          ruff check . || true
