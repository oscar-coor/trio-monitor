[pytest]
addopts = -q
testpaths = tests
markers =
    integration: integration tests
filterwarnings =
    # Pydantic v2 deprecations
    ignore:.*class-based `config` is deprecated.*:DeprecationWarning:pydantic.*
    ignore:.*`json_encoders` is deprecated.*:DeprecationWarning:pydantic.*
    ignore:.*The `dict` method is deprecated.*:DeprecationWarning:pydantic.*
    # SQLAlchemy 2.0 deprecations
    ignore:.*declarative_base\(\).*deprecated.*:DeprecationWarning:sqlalchemy\..*
